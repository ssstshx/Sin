name: Convert ProxyLite for v2rayN

on:
  push:
    paths:
      - "ProxyLite.list"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      # 1. 下载仓库
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 转换 ProxyLite.list
      - name: Convert ProxyLite.list to v2rayN JSON
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          # =========================
          # 基本设置
          # =========================

          SOURCE = Path("ProxyLite.list")
          OUTPUT = Path("ProxyLite-v2rayn.json")

          # V2RayN 中代理出站的 Tag
          PROXY_TAG = "proxy"

          # V2RayN 中显示的规则名称
          RULE_NAME = "ProxyLite"

          # =========================
          # 读取 ProxyLite.list
          # =========================

          all_domains = []

          lines = SOURCE.read_text(
              encoding="utf-8-sig"
          ).splitlines()

          for raw_line in lines:

              line = raw_line.strip()

              # 忽略空行
              if not line:
                  continue

              # 忽略所有注释
              #
              # 例如：
              # #Pve
              # #lite
              # #✈️
              # #18+
              #
              # 这些只是 ProxyLite.list 中方便管理的分类
              if line.startswith("#"):
                  continue

              # 分割规则类型和域名
              parts = line.split(",", 1)

              if len(parts) != 2:
                  print(f"跳过无法识别的规则：{line}")
                  continue

              rule_type = parts[0].strip().upper()
              value = parts[1].strip()

              if not value:
                  continue

              # =========================
              # Clash DOMAIN-SUFFIX
              # ↓
              # V2RayN domain:
              # =========================

              if rule_type == "DOMAIN-SUFFIX":
                  all_domains.append(
                      "domain:" + value
                  )

              # =========================
              # Clash DOMAIN
              # ↓
              # V2RayN full:
              # =========================

              elif rule_type == "DOMAIN":
                  all_domains.append(
                      "full:" + value
                  )

              else:
                  print(
                      f"跳过暂不支持的规则类型：{line}"
                  )

          # =========================
          # 去重，同时保持原顺序
          # =========================

          all_domains = list(
              dict.fromkeys(all_domains)
          )

          # =========================
          # 生成 V2RayN 规则
          # =========================

          rules = []

          if all_domains:

              rules.append({
                  "port": "",
                  "outboundTag": PROXY_TAG,
                  "domain": all_domains,
                  "enabled": True,
                  "remarks": RULE_NAME
              })

          # =========================
          # 写入 JSON
          # =========================

          OUTPUT.write_text(
              json.dumps(
                  rules,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          # =========================
          # 输出检查信息
          # =========================

          print()
          print("====================================")
          print("ProxyLite → V2RayN 转换完成")
          print("====================================")
          print(f"原始规则数量：{len(lines)}")
          print(f"有效域名数量：{len(all_domains)}")
          print(f"输出文件：{OUTPUT}")
          print("规则名称：ProxyLite")
          print(f"代理 Tag：{PROXY_TAG}")
          print("====================================")
          print()

          print(
              json.dumps(
                  rules,
                  ensure_ascii=False,
                  indent=2
              )
          )
          PY

      # 3. 把生成的 JSON 提交回 GitHub
      - name: Commit generated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ProxyLite-v2rayn.json

          if git diff --cached --quiet; then
            echo "没有检测到变化，不需要提交。"
          else
            git commit -m "Auto update ProxyLite for v2rayN"
            git push
          fi
